name: Refresh and publish Role Radar
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
      timezone: America/New_York
    - cron: '43 11 * * *'
      timezone: America/New_York

concurrency:
  group: role-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh employer feeds
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$SCHEDULE" = '43 11 * * *' ] && python scripts/is_current.py; then
            echo "The morning feed is current. Republishing it without polling again."
          else
            python scripts/refresh.py
          fi
      - name: Preserve feed in Git
        run: |
          if git diff --quiet -- app/data/jobs.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/data/jobs.json
          git commit -m 'Refresh employer job feed'
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish app
        id: deploy
        uses: actions/deploy-pages@v4
